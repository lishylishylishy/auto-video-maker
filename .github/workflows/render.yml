# 🎬 GitHub Actions 云端渲染工作流配置文件
name: Render Video Pipeline

on:
  workflow_dispatch:
    inputs:
      sheet_tab:
        description: 'Target Sheet Tab'
        required: true
        default: 'script'

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout
        uses: actions/checkout@v4

      - name: 2. Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 3. Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: 4. Install Dependencies
        run: pip install -r requirements.txt

      - name: 5. Run Script
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          # 关键：将用户指定的 Tab 名称注入为环境变量
          TARGET_TAB: ${{ github.event.inputs.sheet_tab }}
        run: python main.py

      - name: 6. Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rendered-Video-Output
          path: "*.mp4"
