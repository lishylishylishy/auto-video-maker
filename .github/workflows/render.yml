# 🎬 GitHub Actions 云端渲染工作流配置文件
name: Render Video Pipeline

on:
  workflow_dispatch:
    inputs:
      sheet_tab:
        description: 'Target Sheet Tab'
        required: true
        default: 'script'

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout
        uses: actions/checkout@v4

      - name: 2. Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # ⚡ 使用精简版 apt 安装全功能 FFmpeg (包含 drawtext 字幕滤镜，10秒极速完成)
      - name: 3. Setup Complete FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg

      # ⚡ 开启 pip 依赖缓存
      - name: 4. Cache Python Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: 5. Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 6. Run Script
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          TARGET_TAB: ${{ github.event.inputs.sheet_tab }}
        run: python main.py

      - name: 7. Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rendered-Video-Output
          path: "*.mp4"
