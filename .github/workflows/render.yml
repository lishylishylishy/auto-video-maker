name: Render Video Pipeline

on:
  workflow_dispatch:
    inputs:
      sheet_tab:
        description: 'Target Sheet Tab'
        required: true
        default: 'script'
      resolution:
        description: 'Video resolution (widthxheight, e.g. 1920x1080)'
        required: false
        default: '1920x1080'
      video_fps:
        description: 'Video frame rate, e.g. 30 / 60'
        required: false
        default: '30'

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout
        uses: actions/checkout@v4

      - name: 2. Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # ⚡ 使用全功能静态编译包（包含 drawtext 滤镜 + ffprobe），仅下载单文件，5秒极速完成
      - name: 3. Setup Fast Complete FFmpeg
        run: |
          wget -q https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz
          tar -xf ffmpeg-master-latest-linux64-gpl.tar.xz
          sudo cp ffmpeg-master-latest-linux64-gpl/bin/ffmpeg /usr/local/bin/
          sudo cp ffmpeg-master-latest-linux64-gpl/bin/ffprobe /usr/local/bin/
          rm -rf ffmpeg-master-latest-linux64-gpl*
          ffmpeg -version

      - name: 4. Cache Python Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: 5. Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 6. Run Script
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          TARGET_TAB: ${{ github.event.inputs.sheet_tab }}
          VIDEO_RESOLUTION: ${{ github.event.inputs.resolution }}
          VIDEO_FPS: ${{ github.event.inputs.video_fps }}

        run: python main.py

      - name: 7. Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rendered-Video-Output
          path: "*.mp4"
